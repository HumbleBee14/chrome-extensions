name: Chrome Web Store

on:
  push:
    branches: [main]
    paths:
      [
        "vblur/**",
        "intentional/**",
        "scripts/**",
        ".github/workflows/chrome-web-store.yml",
      ]
  pull_request:
    paths:
      [
        "vblur/**",
        "intentional/**",
        "scripts/**",
        ".github/workflows/chrome-web-store.yml",
      ]
  workflow_dispatch:
    inputs:
      extension:
        description: Extension
        type: choice
        options: [vblur, intentional]
        required: true
      action:
        description: "Build ZIP, check status, upload draft, or upload and submit for review"
        type: choice
        options: [build, status, upload, submit]
        default: build
        required: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store-${{ inputs.extension || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        extension: ${{ fromJSON(inputs.extension == 'vblur' && '["vblur"]' || inputs.extension == 'intentional' && '["intentional"]' || '["vblur","intentional"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Test deployment tooling
        run: node --test scripts/*.test.mjs
      - name: Install Intentional development dependencies
        if: matrix.extension == 'intentional'
        run: npm ci --ignore-scripts
        working-directory: intentional
      - name: Check Intentional
        if: matrix.extension == 'intentional'
        run: npm run check
        working-directory: intentional
      - name: Build extension ZIP
        env:
          EXTENSION: ${{ matrix.extension }}
        run: node scripts/package-extension.mjs "$EXTENSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.extension }}
          path: dist/${{ matrix.extension }}-*.zip
          if-no-files-found: error
          retention-days: 14

  store:
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'build' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rebuild selected package
        env:
          EXTENSION: ${{ inputs.extension }}
        run: node scripts/package-extension.mjs "$EXTENSION"
      - name: Authenticate Chrome Extensions Publisher
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CHROME_GOOGLE_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false
      - name: Chrome Web Store API
        env:
          EXTENSION: ${{ inputs.extension }}
          STORE_ACTION: ${{ inputs.action }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ vars.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_EXTENSION_VBLUR_ID: ${{ secrets.CHROME_EXTENSION_VBLUR_ID }}
          CHROME_EXTENSION_INTENTIONAL_ID: ${{ vars.CHROME_EXTENSION_INTENTIONAL_ID }}
          CHROME_WEBSTORE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: node scripts/chrome-web-store.mjs "$EXTENSION" "$STORE_ACTION"
